<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GoalTasker - Organiza tus metas futbolísticas">
    <meta property="og:title" content="GoalTasker">
    <meta property="og:description" content="Organiza tus metas futbolísticas">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#00a86b">
    <title>GoalTasker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-actions">
                <button class="icon-btn lang-flag" id="langToggle" aria-label="Switch to English">
                    <svg viewBox="0 0 60 40" width="22" height="15" aria-hidden="true"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0l60 40M60 0L0 40" stroke="#C8102E" stroke-width="4"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="6"/></svg>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="header-brand">
                <i class="fas fa-futbol header-icon"></i>
                <h1>GoalTasker</h1>
            </div>
        </header>

        <main class="main">
            <div class="progress-section">
                <div class="progress-header">
                    <span data-i18n="progress">Progreso</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
                </div>
            </div>

            <form id="taskForm" class="task-form" autocomplete="off">
                <div class="form-main">
                    <input
                        type="text"
                        id="taskInput"
                        class="task-input"
                        data-i18n-placeholder="placeholder"
                        placeholder="¿Qué quieres conseguir hoy?"
                        required
                        aria-label="Nueva tarea"
                    >
                    <button type="submit" class="btn-add" aria-label="Añadir tarea">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="form-extras" id="formExtras">
                    <select id="categorySelect" class="form-select" aria-label="Categoría">
                        <option value="" data-i18n="category">Categoría</option>
                        <option value="entreno">🏋️ Entreno</option>
                        <option value="partido">⚽ Partido</option>
                        <option value="tactica">📋 Táctica</option>
                        <option value="fisico">💪 Físico</option>
                        <option value="nutricion">🥗 Nutrición</option>
                        <option value="otro">📌 Otro</option>
                    </select>
                    <select id="prioritySelect" class="form-select" aria-label="Prioridad">
                        <option value="" data-i18n="priority">Prioridad</option>
                        <option value="alta">🔴 Alta</option>
                        <option value="media">🟡 Media</option>
                        <option value="baja">🟢 Baja</option>
                    </select>
                    <input type="date" id="dueDate" class="form-date" aria-label="Fecha límite">
                </div>
            </form>

            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    data-i18n-placeholder="search"
                    placeholder="Buscar..."
                    aria-label="Buscar tareas"
                >
                <button class="search-clear" id="searchClear" aria-label="Limpiar búsqueda" style="display:none">
                    <i class="fas fa-times"></i>
                </button>
                <span class="search-hint">Ctrl+K</span>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-layer-group"></i>
                    <span data-i18n="all">Todas</span>
                </button>
                <button class="filter-btn" data-filter="pending">
                    <i class="fas fa-clock"></i>
                    <span data-i18n="pending">Pendientes</span>
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-double"></i>
                    <span data-i18n="completed">Completadas</span>
                </button>
            </div>

            <div class="tasks-section">
                <ul id="taskList" class="task-list" role="list"></ul>
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-futbol empty-icon"></i>
                    <p data-i18n="noTasks">No hay tareas todavía</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-actions">
                <button class="footer-btn" id="exportBtn">
                    <i class="fas fa-download"></i>
                    <span data-i18n="export">Exportar</span>
                </button>
                <button class="footer-btn" id="importBtn">
                    <i class="fas fa-upload"></i>
                    <span data-i18n="import">Importar</span>
                </button>
            </div>
            <p>⚽ GoalTasker &mdash; <span id="currentYear"></span> &mdash; <a href="https://github.com/CesarMed06/GoalTasker" target="_blank" rel="noopener" class="footer-link">GitHub</a></p>
        </footer>
        <input type="file" id="importFile" accept=".json" hidden>

        <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

        <div class="modal-overlay" id="confirmModal" aria-hidden="true">
            <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-label="Confirmar">
                <div class="modal-body">
                    <p id="confirmMsg"></p>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" id="confirmNo" data-i18n="confirmNo">No</button>
                    <button class="btn-save" id="confirmYes" data-i18n="confirmYes">Sí</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="editModal" aria-hidden="true">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <div class="modal-header">
                    <h2 id="modalTitle" data-i18n="editTask">Editar tarea</h2>
                    <button class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="modalText" class="task-input" data-i18n-placeholder="editPlaceholder" placeholder="Editar tarea..." aria-label="Texto de la tarea">
                    <div class="form-extras">
                        <select id="modalCategory" class="form-select" aria-label="Categoría">
                            <option value="" data-i18n="category">Categoría</option>
                        </select>
                        <select id="modalPriority" class="form-select" aria-label="Prioridad">
                            <option value="" data-i18n="priority">Prioridad</option>
                        </select>
                        <input type="date" id="modalDate" class="form-date" aria-label="Fecha límite">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" id="modalCancel" data-i18n="cancel">Cancelar</button>
                    <button class="btn-save" id="modalSave">
                        <i class="fas fa-check"></i>
                        <span data-i18n="save">Guardar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <script src="js/app.js"></script>
</body>
</html>
